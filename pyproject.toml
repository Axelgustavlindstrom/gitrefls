[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitrefls"
version = "0.1.0"
description = "Inspect Git reflog activity, branch drift, and reachability summaries."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "ProjectCreationAgent" }]
keywords = ["git", "reflog", "cli", "reports"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Version Control :: Git"
]

[project.scripts]
gitrefls = "gitrefls.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gitrefls*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[project.urls]
Repository = "https://github.com/Axelgustavlindstrom/gitrefls"
